services:
  postgres:
    image: postgres:16-alpine
    container_name: bond-sports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bond
      POSTGRES_PASSWORD: bond
      POSTGRES_DB: bond_sports
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bond -d bond_sports"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bond-sports-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bond:bond@postgres:5432/bond_sports
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  postgres-data:
